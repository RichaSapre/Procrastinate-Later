name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Verify main.py existence
        run: ls backend/main.py
      - name: Verify endpoints
        run: |
          grep -q "@app.post(\"/tasks\")" backend/main.py
          grep -q "@app.get(\"/tasks/today\")" backend/main.py
          grep -q "@app.post(\"/tasks/start\")" backend/main.py
          grep -q "@app.post(\"/tasks/complete\")" backend/main.py
          grep -q "@app.post(\"/procrastination-log\")" backend/main.py
          grep -q "@app.get(\"/report/weekly\")" backend/main.py
          grep -q "@app.post(\"/anchor\")" backend/main.py
          grep -q "@app.get(\"/anchor/today\")" backend/main.py
          grep -q "@app.get(\"/stats/categories\")" backend/main.py
          grep -q "@app.get(\"/streaks\")" backend/main.py
      - name: Check syntax
        run: python -m py_compile backend/main.py
      - name: Log Success
        run: echo "Backend CI check successful."
