name: Frontend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: cd frontend && npm install
      - name: Verify component files
        run: |
          ls frontend/src/components/DailySetup.jsx
          ls frontend/src/components/Dashboard.jsx
          ls frontend/src/components/TaskDetail.jsx
          ls frontend/src/components/ProcrastinationCheck.jsx
          ls frontend/src/components/StreakDashboard.jsx
          ls frontend/src/components/WeeklyReport.jsx
      - name: Build frontend
        run: cd frontend && npm run build
      - name: Log Success
        run: echo "Frontend CI check successful."
